<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickNotes - Day 4</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <section class="notes-card">
      <div class="header-row">
        <div>
          <h1>QuickNotes</h1>
          <p>Write a note and save it as a draft.</p>
        </div>

        <button id="theme-toggle" type="button">Dark mode</button>
      </div>

      <div class="status-row" aria-live="polite">
        <span id="save-status" class="save-status neutral">Draft ready</span>
        <span id="last-saved" class="last-saved">Not saved yet</span>
      </div>

      <label for="note-text">Your note</label>

      <textarea
        id="note-text"
        rows="10"
        maxlength="200"
        placeholder="Start typing your note..."
      ></textarea>

      <div class="counters">
        <p id="char-count" class="count-pill">0 / 200 characters</p>
        <p id="word-count" class="count-pill">0 words</p>
      </div>

      <div class="button-row">
        <button id="new-note-btn" type="button" class="secondary">New note</button>
        <button id="clear-btn" type="button" class="danger">Clear</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
