<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <div class="container">
      <h1>QuickNotes</h1>
      <p>Capture ideas quickly. Find them easily.</p>
    </div>
  </header>

  <main>
    <section aria-labelledby="add-heading">
      <h2 id="add-heading">Add a note</h2>
      <form id="note-form">
        <label for="note-input">Note</label>
        <input id="note-input" type="text" maxlength="200" placeholder="Write your note..." autocomplete="off">

        <label for="note-category">Category</label>
        <select id="note-category">
          <option value="Personal">Personal</option>
          <option value="Work">Work</option>
          <option value="Study">Study</option>
        </select>

        <button type="submit">Add Note</button>
      </form>
      <p id="error-message" role="alert"></p>
    </section>

    <section aria-labelledby="notes-heading">
      <h2 id="notes-heading">Your notes</h2>
      <label for="search-input">Search notes</label>
      <input id="search-input" type="search" placeholder="Search your notes..." autocomplete="off">
      <p id="note-count">You have no notes yet.</p>
      <ul id="notes-list"></ul>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 QuickNotes</p>
  </footer>
</body>
</html>
